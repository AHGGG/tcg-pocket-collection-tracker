name: Video UI verification source
on:
  push:
    branches: [feat/local-video-import]
    paths: [.github/workflows/video-ui-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package source without account settings or user media
        run: |
          tar --exclude='frontend/public' --exclude='node_modules' --exclude='frontend/.env*' -cf /tmp/source.tar frontend tests docs .github package.json pnpm-lock.yaml pnpm-workspace.yaml biome.json CLAUDE.md
          find frontend/public -path '*/A1/1.webp' -o -path '*/A1/2.webp' -o -path '*/A1/3.webp' | tar -rf /tmp/source.tar -T -
          gzip /tmp/source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: video-ui-source
          path: /tmp/source.tar.gz
          retention-days: 1
