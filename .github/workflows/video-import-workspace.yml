name: Prepare video import verification workspace
on:
  push:
    branches: [feat/local-video-import]
    paths: [.github/workflows/video-import-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Package source and tools for isolated verification
        shell: bash
        run: |
          tar --exclude='frontend/public' --exclude='frontend/.env*' --exclude='frontend/dist' -cf /tmp/workspace.tar frontend node_modules tests docs .github package.json pnpm-lock.yaml pnpm-workspace.yaml biome.json
          tar -rf /tmp/workspace.tar frontend/public/model frontend/public/hashes
          gzip /tmp/workspace.tar
      - uses: actions/upload-artifact@v4
        with:
          name: video-import-verification-workspace
          path: /tmp/workspace.tar.gz
          retention-days: 1
