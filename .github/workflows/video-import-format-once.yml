name: Finish video importer formatting
on:
  push:
    branches: [feat/local-video-import]
    paths: [.github/workflows/video-import-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'AHGGG/tcg-pocket-collection-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Fix existing accessibility and CSS ordering diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/features/video-import/Calibration.tsx')
          s = p.read_text()
          s = s.replace('className="button-row" aria-label="Region to mark"', 'className="button-row"')
          p.write_text(s)
          p = Path('frontend/src/features/video-import/video-import.css')
          s = p.read_text()
          rule = 'fieldset:disabled canvas { pointer-events: none; opacity: 0.7; }'
          if rule in s:
              s = s.replace(rule + '\n', '') + '\n' + rule + '\n'
          p.write_text(s)
          PY
      - name: Format only video importer changes
        run: pnpm exec biome check --write frontend/src/features/video-import frontend/src/pages/scan/Scan.tsx frontend/src/services/scanner/VideoScanService.ts frontend/tests/video-import.browser.ts frontend/tests/video-import.automatic.tsx frontend/tests/video-import.fixture.ts tests/video-import/core.test.ts tests/video-import/automatic.test.ts tests/video-import/browser-runner.mjs
      - run: pnpm lint
      - name: Commit verified formatting without overwriting concurrent changes
        env:
          LEFTHOOK: '0'
        run: |
          git add frontend/src/features/video-import frontend/src/pages/scan/Scan.tsx frontend/src/services/scanner/VideoScanService.ts frontend/tests/video-import.browser.ts frontend/tests/video-import.automatic.tsx frontend/tests/video-import.fixture.ts tests/video-import/core.test.ts tests/video-import/automatic.test.ts tests/video-import/browser-runner.mjs
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: finish video importer formatting and accessibility checks'
            git push origin HEAD:refs/heads/feat/local-video-import
          fi
          git log -1 --format='%H %s'
